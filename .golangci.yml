version: "2"

run:
  tests: true

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true

linters:
  enable:
    - bodyclose
    - copyloopvar
    - dupl
    - goconst
    - gocritic
    - gocyclo
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - importas
    - misspell
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - tparallel
    - unconvert
    - wastedassign
  settings:
    dupl:
      threshold: 150
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - commentedOutCode
        - sloppyReassign
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104
        - G301
        - G302
      severity: medium
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      rules:
        - name: package-comments
          disabled: true
        - name: comment-spacings
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - goconst
        path: .*\.go
        text: string `.*[あ-んア-ンー一-龯].*` has.*
      - linters:
          - forbidigo
        path: _test\.go
      - linters:
          - gosec
        text: G404.*weak random number generator
      - linters:
          - unparam
        text: is unused
      - linters:
          - goconst
        path: (.+)_test\.go
    paths:
      - .*_test.go
      - vendor
      - .git
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - .*_test.go
      - vendor
      - .git
      - third_party$
      - builtin$
      - examples$
